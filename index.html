function apiWrite(type,data={}){

    method:"POST",

function syncFromSpreadsheet(){
  return new Promise((resolve,reject)=>{
    const cb="dbTikCallback_"+Date.now()+"_"+Math.floor(Math.random()*100000);
    const script=document.createElement("script");
    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error("Timeout mengambil data dari Spreadsheet."));
    },15000);

    function cleanup(){
      clearTimeout(timer);
      try{delete window[cb]}catch{}
      script.remove();
    }

    window[cb]=(res)=>{
      cleanup();
      if(!res || !res.status || !res.data){
        reject(new Error(res?.message||"Spreadsheet mengembalikan data tidak valid."));
        return;
      }

      const d=res.data;
      const students=(d.students||[]).map(x=>({
        id:String(x.ID||"").trim(),
        name:String(x.Nama||"").trim(),
        className:String(x.Kelas||"").trim()
      })).filter(x=>x.id);

      const questions=(d.questions||[]).map(x=>({
        id:String(x["ID Soal"]||("Q-"+x.No)).trim(),
        no:Number(x.No)||0,
        question:String(x.Soal||""),
        options:[
          String(x["Option A"]||""),
          String(x["Option B"]||""),
          String(x["Option C"]||""),
          String(x["Option D"]||"")
        ],
        correct:Math.max(0,Math.min(3,Number(x.Kunci)||0)),
        weight:Math.max(1,Number(x.Bobot)||1),
        chapter:String(x.Bab||"")
      })).filter(x=>x.question);

      const tokens=(d.tokens||[]).map(x=>({
        code:String(x.Token||"").trim().toUpperCase(),
        studentId:String(x["ID Siswa"]||"").trim(),
        active:String(x.Aktif).toLowerCase()==="true" || x.Aktif===true,
        used:false,
        createdAt:x["Waktu Dibuat"]||"",
        usedAt:""
      })).filter(x=>x.code);

      const results=(d.results||[]).map(x=>{
        let details=[];
        try{details=JSON.parse(x["Detail JSON"]||"[]")}catch{}
        return {
          id:String(x["ID Hasil"]||"").trim(),
          date:String(x.Tanggal||""),
          studentId:String(x["ID Siswa"]||""),
          name:String(x.Nama||""),
          className:String(x.Kelas||""),
          token:String(x.Token||""),
          exam:String(x.Ujian||""),
          score:Number(x.Nilai)||0,
          correct:Number(x.Benar)||0,
          wrong:Number(x.Salah)||0,
          blank:Number(x.Kosong)||0,
          total:Number(x.Total)||0,
          totalWeight:Number(x["Total Bobot"])||0,
          earnedWeight:Number(x["Bobot Diperoleh"])||0,
          kkm:Number(x.KKM)||config.kkm,
          status:String(x.Status||"").trim(),
          passed:String(x.Status||"").toUpperCase()==="LULUS",
          details
        };
      }).filter(x=>x.id);

      save("studentsDB",students);
      save("questionsDB",questions);
      save("tokensDB",tokens);
      save("resultsDB",results);
      localStorage.setItem("dbLastSync",new Date().toISOString());
      resolve({students,questions,tokens,results});
    };

    script.onerror=()=>{
      cleanup();
      reject(new Error("Tidak dapat terhubung ke Google Apps Script. Pastikan Web App dideploy sebagai Anyone dan URL /exec benar."));
    };

    script.src=config.googleSheetWebAppUrl+"?action=getData&callback="+encodeURIComponent(cb)+"&_="+Date.now();
    document.body.appendChild(script);
  });
}

function syncStartup(){
  const el=document.getElementById("syncStatus");
  if(el)el.textContent="Menghubungkan ke Google Spreadsheet...";
  return syncFromSpreadsheet().then(d=>{
    if(el)el.textContent=`✓ Spreadsheet terhubung • ${d.students.length} siswa • ${d.questions.length} soal • ${d.tokens.length} token • ${d.results?.length||0} hasil`;
    // Data baru sudah masuk localStorage; render ulang agar perangkat HP langsung memakai data terbaru.
    try{ render(); }catch(e){ console.warn("Render setelah sync gagal:",e); }
    return d;
  }).catch(e=>{
    console.warn("Sync Spreadsheet gagal:",e);
    if(el)el.textContent="⚠ Spreadsheet tidak terhubung — data lokal digunakan";
    try{ render(); }catch(err){ console.warn("Render fallback gagal:",err); }
    return null;
  });
}

function apiCheckToken(token,studentId){
  return new Promise((resolve,reject)=>{
    if(!config.googleSheetWebAppUrl)return resolve(null);
    const cb="dbTikToken_"+Date.now();
    const script=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();reject(new Error("Timeout cek token"));},10000);
    function cleanup(){clearTimeout(timer);try{delete window[cb]}catch{}script.remove();}
    window[cb]=res=>{cleanup();if(!res||!res.status)return reject(new Error(res?.message||"Respons token tidak valid"));resolve(res.data||null);};
    script.onerror=()=>{cleanup();reject(new Error("Gagal terhubung ke Spreadsheet"));};
    script.src=config.googleSheetWebAppUrl+
      "?action=checkToken&token="+encodeURIComponent(token)+
      "&studentId="+encodeURIComponent(studentId)+
      "&callback="+encodeURIComponent(cb)+"&_="+Date.now();
    document.body.appendChild(script);
  });
}

function uid(prefix="ID"){return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7).toUpperCase()}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function formatTime(s){const m=Math.floor(s/60),sec=s%60;return `${m}:${String(sec).padStart(2,"0")}`}
function now(){return new Date().toLocaleString("id-ID")}
const DEFAULT_TOKEN_MINUTES=60;
function tokenExpired(t){
  if(!t)return true;
  if(t.expiresAt){
    const exp=new Date(String(t.expiresAt));
    if(Number.isFinite(exp.getTime())) return Date.now() >= exp.getTime();
  }
  if(t.createdAt){
    const raw=String(t.createdAt).trim();
    let d=new Date(raw);
    const m=raw.match(/^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2}):(\d{2})$/);
    if(m)d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]),Number(m[4]),Number(m[5]),Number(m[6]));
    if(Number.isFinite(d.getTime())){
      const minutes=Math.max(1,Number(t.durationMinutes)||DEFAULT_TOKEN_MINUTES);
      return (Date.now()-d.getTime()) >= minutes*60*1000;
    }
  }
  // Token baru/legacy tanpa waktu valid tidak langsung dianggap kedaluwarsa.
  return false;
}
function load(key,fallback){try{const x=JSON.parse(localStorage.getItem(key));return x??fallback}catch{return fallback}}
function save(key,val){localStorage.setItem(key,JSON.stringify(val))}
function downloadBlob(filename,blob){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function xmlEsc(v){
  return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;");
}
function docxParagraph(text,bold=false){
  return `<w:p><w:r>${bold?"<w:rPr><w:b/></w:rPr>":""}<w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p>`;
}
async function exportWordDocument(filename,title,paragraphs){
  if(!window.JSZip)return alert("Modul Word belum termuat. Pastikan internet aktif lalu buka ulang aplikasi.");
  const zip=new JSZip();
  const body=paragraphs.map(x=>typeof x==="string"?docxParagraph(x):docxParagraph(x.text,x.bold)).join("");
  const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>
${docxParagraph(title,true)}
${body}
<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr>
</w:body></w:document>`;
  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;
  const docRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>`;
  zip.file("[Content_Types].xml",contentTypes);
  zip.folder("_rels").file(".rels",rels);
  zip.folder("word").file("document.xml",documentXml);
  zip.folder("word").folder("_rels").file("document.xml.rels",docRels);
  downloadBlob(filename,await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"}));
}

function tokenValid(token,studentName,studentClass){
  const list=getTokens(); const t=list.find(x=>x.code.toUpperCase()===token.toUpperCase()&&x.active&&!tokenExpired(x));
  if(!t)return null;
  const st=getStudents().find(x=>x.name.toLowerCase()===studentName.toLowerCase()&&x.className===studentClass);
  if(t.studentId && (!st || t.studentId!==st.id))return null;
  return t;
}

let examProtectionActive=false;
let examProtectionStarting=false;
let examFullscreenGuard=null;

async function enterExamFullscreen(){
  try{
    if(document.fullscreenElement)return true;
    const el=document.documentElement;
    const fn=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!fn)return false;
    const result=fn.call(el);
    if(result && typeof result.then==="function") await result;
    return !!document.fullscreenElement || !!document.webkitFullscreenElement;
  }catch(e){
    console.warn("Fullscreen gagal:",e);
    return false;
  }
}

async function exitExamFullscreen(){
  try{
    const fn=document.exitFullscreen||document.webkitExitFullscreen;
    if(fn){
      const result=fn.call(document);
      if(result && typeof result.then==="function") await result;
    }
  }catch(e){console.warn("Keluar fullscreen gagal:",e)}
}

function isFullscreen(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}

function showExamLock(){
  state.locked=true;
  clearInterval(state.timer);
  const overlay=document.getElementById("examLockOverlay");
  if(overlay)overlay.classList.add("show");
}

function hideExamLock(){
  state.locked=false;
  const overlay=document.getElementById("examLockOverlay");
  if(overlay)overlay.classList.remove("show");
}

function stopExamProtection(){
  examProtectionActive=false;
  if(examFullscreenGuard){clearInterval(examFullscreenGuard);examFullscreenGuard=null;}
  examProtectionStarting=false;
  document.body.classList.remove("exam-mode");
  const overlay=document.getElementById("examLockOverlay");
  if(overlay)overlay.classList.remove("show");
}

async function startExamProtection(){
  examProtectionActive=true;
  document.body.classList.add("exam-mode");
  const ok=await enterExamFullscreen();
  if(!ok){
    examProtectionActive=false;
    document.body.classList.remove("exam-mode");
    return false;
  }

  // Guard tambahan: beberapa browser/HP tidak selalu mengirim
  // fullscreenchange secara konsisten. Karena itu status fullscreen
  // diperiksa berkala selama ujian berlangsung.
  if(examFullscreenGuard)clearInterval(examFullscreenGuard);
  examFullscreenGuard=setInterval(()=>{
    if(!examProtectionActive || state.screen!=="exam" || state.final){
      clearInterval(examFullscreenGuard);
      examFullscreenGuard=null;
      return;
    }
    if(!isFullscreen() && !state.locked){
      showExamLock();
      render();
    }
  },300);

  return true;
}

document.addEventListener("fullscreenchange",()=>{
  if(!examProtectionActive || state.screen!=="exam" || state.final)return;
  if(!isFullscreen()){
    showExamLock();
    render();
  }else if(state.locked){
    hideExamLock();
    render();
    startTimer();
  }
});

document.addEventListener("webkitfullscreenchange",()=>{
  if(!examProtectionActive || state.screen!=="exam" || state.final)return;
  if(!isFullscreen()){
    showExamLock();
    render();
  }else if(state.locked){
    hideExamLock();
    render();
    startTimer();
  }
});

document.addEventListener("visibilitychange",()=>{
  if(examProtectionActive && state.screen==="exam" && document.visibilityState!=="visible"){
    showExamLock();
  }
});

window.addEventListener("blur",()=>{
  if(examProtectionActive && state.screen==="exam")showExamLock();
});
function selectAnswer(i){if(!state.locked){state.answers[state.current]=i;render()}}
function navigate(d){if(!state.locked){const n=state.current+d;if(n>=0&&n<state.examQuestions.length)state.current=n;render()}}
function scoreData(){
  let correct=0,wrong=0,blank=0;
  state.answers.forEach((a,i)=>{if(a===null||a===undefined)blank++;else if(a===state.examQuestions[i].correct)correct++;else wrong++});
  const totalWeight=state.examQuestions.reduce((a,q)=>a+(q.weight??1),0);
  const earnedWeight=state.examQuestions.reduce((a,q,i)=>a+(state.answers[i]===q.correct?(q.weight??1):0),0);
  const score=totalWeight?Math.round((earnedWeight/totalWeight)*100):0;
  return {score,correct,wrong,blank,total:state.examQuestions.length,totalWeight,earnedWeight,kkm:config.kkm,passed:score>=config.kkm};
}
function submitExam(){
  if(state.final)return;
  clearInterval(state.timer);
  const d=scoreData();
  const matchedStudent=getStudents().find(s=>s.name.toLowerCase()===state.studentName.toLowerCase()&&s.className===state.studentClass);
  const result={
    id:uid("R"),studentId:state.studentId||matchedStudent?.id||"",name:state.studentName,className:state.studentClass,token:state.token,
    date:now(),exam:config.exam_title,score:d.score,correct:d.correct,wrong:d.wrong,
    blank:d.blank,total:d.total,totalWeight:d.totalWeight,earnedWeight:d.earnedWeight,kkm:config.kkm,passed:d.passed,
    details:state.examQuestions.map((q,i)=>({question:q.question,answer:state.answers[i],correct:q.correct,options:q.options,chapter:q.chapter,weight:q.weight??1}))
  };
  const results=getResults();results.push(result);save("resultsDB",results);
  state.final=result;state.screen="result";render();
  if(config.googleSheetWebAppUrl){
    apiWrite("result",result)
      .then(()=>console.log("Hasil tersimpan di Google Spreadsheet."))
      .catch(e=>console.warn("Sinkronisasi hasil gagal:",e));
  }
}

function startExam(student, tok){
  const all=getQuestions();
  if(!all.length)throw new Error("Belum ada soal. Silakan minta admin menginput soal.");
  state.studentId=student.id;
  state.studentName=student.name;
  state.studentClass=student.className;
  state.token=tok.code;
  state.examQuestions=shuffle(all).map(q=>{
    const pairs=q.options.map((text,i)=>({text,isCorrect:i===q.correct}));
    const so=shuffle(pairs);
    return {...q,options:so.map(x=>x.text),correct:so.findIndex(x=>x.isCorrect)};
  });
  state.answers=new Array(state.examQuestions.length).fill(null);
  state.current=0;
  state.timeLeft=config.duration;
  state.locked=false;
  state.final=null;
  state.screen="exam";
  hideExamLock();
  startTimer();
  render();
}

      await syncFromSpreadsheet();

    }
  };

async function importStudentsWord(file){
  if(!file)return;
  if(!window.JSZip)return alert("Modul Word belum termuat. Pastikan internet aktif lalu buka ulang aplikasi.");
  try{
    const zip=await JSZip.loadAsync(file);
    const docFile=zip.file("word/document.xml");
    if(!docFile)throw new Error("File bukan dokumen Word .docx yang valid.");
    const lines=parseDocxParagraphs(await docFile.async("string"));
    const students=[];
    let current={};
    const flush=()=>{
      if(current.name)students.push({id:(current.id||"").trim()||uid("S"),name:current.name.trim(),className:(current.className||"").trim()});
      current={};
    };
    lines.forEach(raw=>{
      const line=String(raw||"").trim();
      let m=line.match(/^id\s*[:\-]\s*(.+)$/i);
      if(m){if(current.name)flush();current.id=m[1];return;}
      m=line.match(/^nama\s*[:\-]\s*(.+)$/i);
      if(m){current.name=m[1];return;}
      m=line.match(/^kelas\s*[:\-]\s*(.+)$/i);
      if(m){current.className=m[1];}
    });
    flush();
    const valid=students.filter(x=>x.name&&x.className);
    if(!valid.length)return alert("Tidak ada data siswa valid. Gunakan format ID, Nama, dan Kelas pada dokumen Word.");
    const db=getStudents(),existing=new Set(db.map(x=>x.id.toLowerCase()));
    const added=valid.filter(x=>!existing.has(x.id.toLowerCase()));
    if(!added.length)return alert("Semua data siswa dari Word sudah ada.");
    if(!confirm(`Ditemukan ${added.length} siswa dari Word. Simpan ke Data Siswa?`))return;
    save("studentsDB",[...db,...added]);
    await Promise.all(added.map(x=>apiWrite("student",x)));
    alert(`${added.length} siswa dari Word berhasil diimpor.`);
    renderAdmin(document.getElementById("app"));
  }catch(err){
    console.error(err);
    alert("Gagal membaca file Word: "+(err.message||err));
  }
}

  document.getElementById("importWordQ").onchange=e=>importWordQuestions(e.target.files[0]);

function exportQuestionsWord(q){
  const p=[];
  q.forEach((x,i)=>{
    p.push({text:`${i+1}. ${x.question}`,bold:true});
    x.options.forEach((o,j)=>p.push(`${String.fromCharCode(65+j)}. ${o}`));
    p.push(`Bobot: ${x.weight??1}`);
    p.push(`Jawaban: ${String.fromCharCode(65+x.correct)}`);
    if(x.chapter)p.push(`Bab: ${x.chapter}`);
    p.push("");
  });
  exportWordDocument("bank-soal.docx","Bank Soal",p);
}

function parseDocxParagraphs(xmlText){
  const xml=new DOMParser().parseFromString(xmlText,"application/xml");
  if(xml.querySelector("parsererror")) throw new Error("Dokumen Word tidak dapat dibaca.");
  const paras=[...xml.getElementsByTagNameNS("http://schemas.openxmlformats.org/wordprocessingml/2006/main","p")];
  return paras.map(p=>{
    let s="";
    [...p.getElementsByTagNameNS("http://schemas.openxmlformats.org/wordprocessingml/2006/main","t")].forEach(t=>s+=t.textContent||"");
    [...p.getElementsByTagNameNS("http://schemas.openxmlformats.org/wordprocessingml/2006/main","tab")].forEach(()=>s+="\t");
    [...p.getElementsByTagNameNS("http://schemas.openxmlformats.org/wordprocessingml/2006/main","br")].forEach(()=>s+="\n");
    return s.replace(/\u00a0/g," ").trim();
  }).filter(Boolean);
}

function parseWordQuestions(lines){
  const result=[];
  let current=null;
  let optionIndex=-1;

  const flush=()=>{
    if(!current)return;
    current.question=current.question.trim();
    current.options=current.options.map(x=>x.trim());
    if(current.question && current.options.every(x=>x)){
      result.push(current);
    }
    current=null;
    optionIndex=-1;
  };

  for(let raw of lines){
    let line=String(raw||"").trim();
    if(!line)continue;

    // Normalisasi bullet/nomor yang kadang muncul dari Word.
    line=line.replace(/^[•·▪◦]\s*/,"").trim();

    // Nomor soal: "1. ..." / "1) ..." / "1 - ..."
    const qMatch=line.match(/^(\d+)\s*[\.\)\-:]\s*(.*)$/);
    if(qMatch){
      flush();
      current={
        id:uid("Q"),
        no:Number(qMatch[1]),
        question:qMatch[2].trim(),
        options:["","","",""],
        correct:0,
        weight:1,
        chapter:""
      };
      continue;
    }

    // Jika belum ada nomor, abaikan bagian pembuka dokumen.
    if(!current)continue;

    const optMatch=line.match(/^([A-Da-d])\s*[\.\)\:\-]\s*(.*)$/);
    if(optMatch){
      const idx=optMatch[1].toUpperCase().charCodeAt(0)-65;
      current.options[idx]=optMatch[2].trim();
      optionIndex=idx;
      continue;
    }

    const answerMatch=line.match(/^(?:jawaban|kunci(?:\s+jawaban)?)\s*[:\-]\s*([A-Da-d])\b/i);
    if(answerMatch){
      current.correct=answerMatch[1].toUpperCase().charCodeAt(0)-65;
      continue;
    }

    const weightMatch=line.match(/^bobot\s*[:\-]\s*(\d+(?:[.,]\d+)?)\b/i);
    if(weightMatch){
      current.weight=Math.max(1,Number(weightMatch[1].replace(",","."))||1);
      continue;
    }

    const chapterMatch=line.match(/^(?:bab|materi)\s*[:\-]\s*(.*)$/i);
    if(chapterMatch){
      current.chapter=chapterMatch[1].trim();
      continue;
    }

    // Baris lanjutan pertanyaan atau pilihan.
    if(optionIndex>=0 && optionIndex<4){
      current.options[optionIndex]+=(current.options[optionIndex]?" ":"")+line;
    }else{
      current.question+=(current.question?" ":"")+line;
    }
  }
  flush();
  return result;
}

async function importWordQuestions(file){
  if(!file)return;
  if(!window.JSZip){
    return alert("Modul pembaca Word belum termuat. Pastikan internet aktif lalu buka ulang aplikasi.");
  }

  try{
    const zip=await JSZip.loadAsync(file);
    const docFile=zip.file("word/document.xml");
    if(!docFile)throw new Error("File bukan dokumen Word .docx yang valid.");

    const xml=await docFile.async("string");
    const lines=parseDocxParagraphs(xml);
    const imported=parseWordQuestions(lines);

    if(!imported.length){
      return alert(
        "Tidak ada soal yang berhasil dibaca.\n\n"+
        "Gunakan format:\n"+
        "1. Pertanyaan...\n"+
        "A. Pilihan A\nB. Pilihan B\nC. Pilihan C\nD. Pilihan D\n"+
        "Bobot: 1\nJawaban: B"
      );
    }

    const db=getQuestions();
    const startNo=db.reduce((m,x)=>Math.max(m,Number(x.no)||0),0)+1;

    const added=imported.map((x,i)=>({
      ...x,
      id:uid("Q"),
      no:startNo+i
    }));

    // Tampilkan konfirmasi jumlah soal sebelum menyimpan.
    const ok=confirm(
      `Ditemukan ${added.length} soal dari Word.\n\n`+
      `Soal akan ditambahkan mulai nomor ${startNo}.\n\n`+
      `Klik OK untuk Simpan Semua ke Bank Soal.`
    );
    if(!ok)return;

    save("questionsDB",[...db,...added]);
    await Promise.all(added.map(x=>apiWrite("question",x)));

    alert(`${added.length} soal dari Word berhasil diimpor dan disimpan.`);
    renderAdmin(document.getElementById("app"));
  }catch(err){
    console.error(err);
    alert("Gagal membaca file Word: "+(err.message||err));
  }
}

  c.innerHTML=`<div class="flex flex-wrap justify-between gap-2 mb-4"><div><h2 class="text-2xl font-bold">Token Ujian</h2><p class="text-slate-600">Atur sendiri durasi token saat membuat token. Token tidak langsung kadaluarsa setelah disimpan.</p></div><div class="flex gap-2"><button id="newToken" class="bg-blue-600 text-white px-4 py-2 rounded-lg">+ Tambah Token</button><button id="clearTokens" class="bg-red-600 text-white px-4 py-2 rounded-lg">Hapus Semua Token</button></div></div>

  document.getElementById("newToken").onclick=()=>createToken();

    if(confirm("Hapus semua token ujian?")){save("tokensDB",[]);renderAdmin(document.getElementById("app"));}
  };
  document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{const a=getTokens();const x=a.find(v=>v.code===b.dataset.toggle);if(!x)return;x.active=!x.active;save("tokensDB",a);apiWrite("token",x).catch(()=>{});renderAdmin(document.getElementById("app"))});
  document.querySelectorAll("[data-delt]").forEach(b=>b.onclick=()=>{if(confirm("Hapus token?")){save("tokensDB",getTokens().filter(x=>x.code!==b.dataset.delt));renderAdmin(document.getElementById("app"))}});

function createToken(){
  const codeInput=prompt("MASUKKAN TOKEN UJIAN\n\nContoh: UJIAN7A-001","UJIAN7A-001");
  if(codeInput===null)return;
  const code=normalizeToken(codeInput);
  if(!code)return alert("Token tidak boleh kosong.");
  const tokens=getTokens();
  if(tokens.some(t=>normalizeToken(t.code)===code))return alert("Token tersebut sudah ada. Gunakan token lain.");

  const minutesInput=prompt("DURASI TOKEN\n\nMasukkan masa berlaku dalam menit.\nContoh: 30, 60, 120","60");
  if(minutesInput===null)return;
  const minutes=Math.max(1,Number(minutesInput)||DEFAULT_TOKEN_MINUTES);
  const created=new Date();
  const expires=new Date(created.getTime()+minutes*60*1000);

  const token={code,active:true,used:false,studentId:null,createdAt:created.toISOString(),expiresAt:expires.toISOString(),durationMinutes:minutes};
  tokens.push(token);
  save("tokensDB",tokens);

  apiWrite("token",token).catch(e=>console.warn("Token lokal tersimpan, sinkronisasi gagal:",e));

  alert("TOKEN BERHASIL DIBUAT\n\nToken: "+code+"\nDurasi: "+minutes+" menit\nDibuat: "+created.toLocaleString("id-ID")+"\nKadaluarsa: "+expires.toLocaleString("id-ID"));
  renderAdmin(document.getElementById("app"));
}

async function exportReports(r){
  const p=[];
  r.slice().reverse().forEach((x,i)=>{
    p.push({text:`${i+1}. ${x.name} - Kelas ${x.className}`,bold:true});
    p.push(`Tanggal: ${x.date}`);
    p.push(`Nilai: ${x.score} | Benar: ${x.correct} | Salah: ${x.wrong} | Kosong: ${x.blank}`);
    p.push(`KKM: ${x.kkm} | Status: ${x.passed?"LULUS":"BELUM LULUS"}`);
    p.push(`Token: ${x.token}`);
    p.push("");
  });
  exportWordDocument("laporan-ujian.docx","Laporan Ujian",p);
}
function showResultDetail(r){
  if(!r)return;
  const wrong=r.details.filter(x=>x.answer!==x.correct);
  const text=wrong.map((x,i)=>`${i+1}. ${x.question}\nJawaban siswa: ${x.answer===null?"Kosong":x.options[x.answer]}\nKunci: ${x.options[x.correct]}`).join("\n\n");
  alert(`Nama: ${r.name}\nKelas: ${r.className}\nNilai: ${r.score}\nBenar: ${r.correct}\nSalah: ${r.wrong}\nKosong: ${r.blank}\nKKM: ${r.kkm}\nStatus: ${r.passed?"LULUS":"BELUM LULUS"}\n\nDETAIL SOAL SALAH/KOSONG:\n${text||"Tidak ada."}`);
}
