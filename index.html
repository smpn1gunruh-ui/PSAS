function apiWrite(type,data={}){
  if(!config.googleSheetWebAppUrl)return Promise.resolve();
  return fetch(config.googleSheetWebAppUrl,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({type,data})
  }).catch(e=>console.warn("Gagal mengirim ke Spreadsheet:",e));
}

function syncFromSpreadsheet(){
  return new Promise((resolve,reject)=>{
    const cb="dbTikCallback_"+Date.now()+"_"+Math.floor(Math.random()*100000);
    const script=document.createElement("script");
    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error("Timeout mengambil data dari Spreadsheet."));
    },15000);

    function cleanup(){
      clearTimeout(timer);
      try{delete window[cb]}catch{}
      script.remove();
    }

    window[cb]=(res)=>{
      cleanup();
      if(!res || !res.status || !res.data){
        reject(new Error(res?.message||"Spreadsheet mengembalikan data tidak valid."));
        return;
      }

      const d=res.data;
      const students=(d.students||[]).map(x=>({
        id:String(x.ID||"").trim(),
        name:String(x.Nama||"").trim(),
        className:String(x.Kelas||"").trim()
      })).filter(x=>x.id);

      const questions=(d.questions||[]).map(x=>({
        id:String(x["ID Soal"]||("Q-"+x.No)).trim(),
        no:Number(x.No)||0,
        question:String(x.Soal||""),
        options:[
          String(x["Option A"]||""),
          String(x["Option B"]||""),
          String(x["Option C"]||""),
          String(x["Option D"]||"")
        ],
        correct:Math.max(0,Math.min(3,Number(x.Kunci)||0)),
        weight:Math.max(1,Number(x.Bobot)||1),
        chapter:String(x.Bab||"")
      })).filter(x=>x.question);

      const tokens=(d.tokens||[]).map(x=>({
        code:String(x.Token||"").trim().toUpperCase(),
        studentId:String(x["ID Siswa"]||"").trim(),
        active:String(x.Aktif).toLowerCase()==="true" || x.Aktif===true,
        used:String(x.Terpakai).toLowerCase()==="true" || x.Terpakai===true,
        createdAt:x["Waktu Dibuat"]||"",
        usedAt:x["Waktu Digunakan"]||""
      })).filter(x=>x.code);

      save("studentsDB",students);
      save("questionsDB",questions);
      save("tokensDB",tokens);
      localStorage.setItem("dbLastSync",new Date().toISOString());
      resolve({students,questions,tokens});
    };

    script.onerror=()=>{
      cleanup();
      reject(new Error("Tidak dapat terhubung ke Google Apps Script. Pastikan Web App dideploy sebagai Anyone dan URL /exec benar."));
    };

    script.src=config.googleSheetWebAppUrl+"?action=getData&callback="+encodeURIComponent(cb)+"&_="+Date.now();
    document.body.appendChild(script);
  });
}

function syncStartup(){
  const el=document.getElementById("syncStatus");
  if(el)el.textContent="Menghubungkan ke Google Spreadsheet...";
  return syncFromSpreadsheet().then(d=>{
    if(el)el.textContent=`✓ Terhubung ke Spreadsheet • ${d.students.length} siswa • ${d.questions.length} soal • ${d.tokens.length} token`;
    // Data baru sudah masuk localStorage; render ulang agar perangkat HP langsung memakai data terbaru.
    try{ render(); }catch(e){ console.warn("Render setelah sync gagal:",e); }
    return d;
  }).catch(e=>{
    console.warn("Sync Spreadsheet gagal:",e);
    if(el)el.textContent="⚠ Spreadsheet tidak terhubung — data lokal digunakan";
    try{ render(); }catch(err){ console.warn("Render fallback gagal:",err); }
    return null;
  });
}

function apiCheckToken(token,studentId){
  return new Promise((resolve,reject)=>{
    if(!config.googleSheetWebAppUrl)return resolve(null);
    const cb="dbTikToken_"+Date.now();
    const script=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();reject(new Error("Timeout cek token"));},10000);
    function cleanup(){clearTimeout(timer);try{delete window[cb]}catch{}script.remove();}
    window[cb]=res=>{cleanup();if(!res||!res.status)return reject(new Error(res?.message||"Respons token tidak valid"));resolve(res.data||null);};
    script.onerror=()=>{cleanup();reject(new Error("Gagal terhubung ke Spreadsheet"));};
    script.src=config.googleSheetWebAppUrl+
      "?action=checkToken&token="+encodeURIComponent(token)+
      "&studentId="+encodeURIComponent(studentId)+
      "&callback="+encodeURIComponent(cb)+"&_="+Date.now();
    document.body.appendChild(script);
  });
}

const defaultStudents = [];

function uid(prefix="ID"){return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7).toUpperCase()}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function formatTime(s){const m=Math.floor(s/60),sec=s%60;return `${m}:${String(sec).padStart(2,"0")}`}
function now(){return new Date().toLocaleString("id-ID")}
function load(key,fallback){try{const x=JSON.parse(localStorage.getItem(key));return x??fallback}catch{return fallback}}
function save(key,val){localStorage.setItem(key,JSON.stringify(val))}
function csvCell(v){return `"${String(v??"").replace(/"/g,'""')}"`}
function downloadText(filename,text,type="text/csv;charset=utf-8"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+text],{type}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];
    if(c=='"'&&q&&n=='"'){cell+='"';i++}
    else if(c=='"')q=!q;
    else if(c==","&&!q){row.push(cell);cell=""}
    else if((c=="\n"||c=="\r")&&!q){if(c=="\r"&&n=="\n")i++;row.push(cell);if(row.some(x=>x.trim()!=""))rows.push(row);row=[];cell=""}
    else cell+=c;
  }
  if(cell!==""||row.length){row.push(cell);if(row.some(x=>x.trim()!=""))rows.push(row)}
  return rows;
}

function getStudents(){return load("studentsDB",[])}
function getQuestions(){return load("questionsDB",[])}
function getTokens(){return load("tokensDB",[])}
function getResults(){return load("resultsDB",[])}
function tokenValid(token,studentName,studentClass){
  const list=getTokens(); const t=list.find(x=>x.code.toUpperCase()===token.toUpperCase()&&x.active&&!x.used);
  if(!t)return null;
  const st=getStudents().find(x=>x.name.toLowerCase()===studentName.toLowerCase()&&x.className===studentClass);
  if(t.studentId && (!st || t.studentId!==st.id))return null;
  return t;
}
function normalizeToken(v){return String(v||"").trim().toUpperCase().replace(/\s+/g,"")}
function generateToken(){return "UJ-"+Math.random().toString(36).slice(2,6).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase()}

function startTimer(){
  clearInterval(state.timer);
  state.timer=setInterval(()=>{
    state.timeLeft--;
    const el=document.getElementById("timer");
    if(el){el.textContent=formatTime(state.timeLeft);if(state.timeLeft<=60)el.classList.add("timer-warning")}
    if(state.timeLeft<=0){clearInterval(state.timer);submitExam()}
  },1000);
}
async function goFullScreen(){if(document.documentElement.requestFullscreen)try{await document.documentElement.requestFullscreen()}catch{}}
document.addEventListener("fullscreenchange",()=>{
  if(!document.fullscreenElement&&state.screen==="exam"&&!state.final){
    state.locked=true;clearInterval(state.timer);render();
  }
});
function selectAnswer(i){if(!state.locked){state.answers[state.current]=i;render()}}
function navigate(d){if(!state.locked){const n=state.current+d;if(n>=0&&n<state.examQuestions.length)state.current=n;render()}}
function scoreData(){
  let correct=0,wrong=0,blank=0;
  state.answers.forEach((a,i)=>{if(a===null||a===undefined)blank++;else if(a===state.examQuestions[i].correct)correct++;else wrong++});
  const totalWeight=state.examQuestions.reduce((a,q)=>a+(q.weight??1),0);
  const earnedWeight=state.examQuestions.reduce((a,q,i)=>a+(state.answers[i]===q.correct?(q.weight??1):0),0);
  const score=totalWeight?Math.round((earnedWeight/totalWeight)*100):0;
  return {score,correct,wrong,blank,total:state.examQuestions.length,totalWeight,earnedWeight,kkm:config.kkm,passed:score>=config.kkm};
}
function submitExam(){
  if(state.final)return;
  clearInterval(state.timer);
  const d=scoreData();
  const matchedStudent=getStudents().find(s=>s.name.toLowerCase()===state.studentName.toLowerCase()&&s.className===state.studentClass);
  const result={
    id:uid("R"),studentId:state.studentId||matchedStudent?.id||"",name:state.studentName,className:state.studentClass,token:state.token,
    date:now(),exam:config.exam_title,score:d.score,correct:d.correct,wrong:d.wrong,
    blank:d.blank,total:d.total,totalWeight:d.totalWeight,earnedWeight:d.earnedWeight,kkm:config.kkm,passed:d.passed,
    details:state.examQuestions.map((q,i)=>({question:q.question,answer:state.answers[i],correct:q.correct,options:q.options,chapter:q.chapter,weight:q.weight??1}))
  };
  const results=getResults();results.push(result);save("resultsDB",results);
  const tokens=getTokens();const ti=tokens.findIndex(t=>t.code.toUpperCase()===state.token.toUpperCase());
  if(ti>=0){tokens[ti].used=true;tokens[ti].usedAt=now();tokens[ti].usedBy=state.studentName;save("tokensDB",tokens)}
  state.final=result;state.screen="result";render();
  if(config.googleSheetWebAppUrl){
    apiWrite("result",result)
      .then(()=>console.log("Hasil tersimpan di Google Spreadsheet."))
      .catch(e=>console.warn("Sinkronisasi hasil gagal:",e));
  }
}

function startExam(student, tok){
  const all=getQuestions();
  if(!all.length)return alert("Belum ada soal. Silakan minta admin menginput soal.");
  state.studentId=student.id; state.studentName=student.name; state.studentClass=student.className; state.token=tok.code;
  state.examQuestions=shuffle(all).map(q=>{
    const pairs=q.options.map((text,i)=>({text,isCorrect:i===q.correct}));
    const so=shuffle(pairs);
    return {...q,options:so.map(x=>x.text),correct:so.findIndex(x=>x.isCorrect)};
  });
  state.answers=new Array(state.examQuestions.length).fill(null);
  state.current=0;state.timeLeft=config.duration;state.locked=false;state.final=null;
  goFullScreen();state.screen="exam";startTimer();render();
}

}

function renderStart(app){
  app.innerHTML=`<div class="min-h-full flex items-center justify-center bg-[${config.background_color}] p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl">
      <div class="text-center mb-6"><h1 class="text-2xl font-bold">${esc(config.exam_title)}</h1><p>${esc(config.school_name)}</p><p class="text-slate-600">${esc(config.subject_info)}</p></div>
      <div class="space-y-4">
        <div><label class="font-semibold">Nama Siswa</label><input id="name" class="w-full border rounded-lg p-3 mt-1" placeholder="Nama lengkap" autocomplete="off"></div>
        <div><label class="font-semibold">NIS</label><input id="nis" class="w-full border rounded-lg p-3 mt-1" placeholder="Nomor Induk Siswa" autocomplete="off"></div>
        <div><label class="font-semibold">Kelas</label><div id="classDisplay" class="w-full border rounded-lg p-3 mt-1 bg-slate-100 text-slate-500">Otomatis berdasarkan NIS</div><input id="class" type="hidden"></div>
        <div id="studentStatus" class="text-xs text-slate-500 -mt-2"></div>
        <div><label class="font-semibold">Token Ujian</label><input id="token" class="w-full border rounded-lg p-3 mt-1 uppercase" placeholder="Masukkan token" autocomplete="off"></div>
        <div id="startError" class="hidden text-sm bg-red-50 text-red-700 p-3 rounded-lg"></div>
        <button id="start" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">Mulai Ujian</button>
        <button id="admin" class="w-full border border-slate-300 py-2 rounded-lg">Panel Admin</button>
      </div>
      <p class="text-xs text-slate-500 mt-5 text-center">KKM: ${config.kkm} • Durasi: ${Math.floor(config.duration/60)} menit</p>
    </div></div>`;

  const nis=document.getElementById("nis"), name=document.getElementById("name"), cls=document.getElementById("class"), cd=document.getElementById("classDisplay"), status=document.getElementById("studentStatus"), err=document.getElementById("startError");
  function lookup(){
    const s=getStudents().find(x=>String(x.id).trim().toLowerCase()===nis.value.trim().toLowerCase());
    if(s){
      name.value=s.name; cls.value=s.className; cd.textContent=s.className; cd.className="w-full border rounded-lg p-3 mt-1 bg-green-50 text-green-700 font-bold";
      status.textContent="✓ NIS ditemukan. Nama dan kelas sesuai data siswa."; status.className="text-xs text-green-600 -mt-2";
      return s;
    }
    cls.value=""; cd.textContent="Otomatis berdasarkan NIS"; cd.className="w-full border rounded-lg p-3 mt-1 bg-slate-100 text-slate-500";
    status.textContent=nis.value.trim()?"NIS tidak ditemukan di Data Siswa.":""; status.className="text-xs text-red-600 -mt-2";
    return null;
  }
  nis.oninput=lookup;

  document.getElementById("start").onclick=async()=>{
    err.classList.add("hidden");
    const btn=document.getElementById("start");
    btn.disabled=true; btn.textContent="Menghubungkan ke Spreadsheet...";

    try{
      // Ambil data terbaru tepat sebelum ujian dimulai.
      await syncFromSpreadsheet();

      const s=lookup(), t=normalizeToken(document.getElementById("token").value);
      if(!s)throw new Error("NIS tidak ditemukan di Data Siswa.");
      if(!t)throw new Error("Token wajib diisi.");

      const online=await apiCheckToken(t,s.id);
      if(online && online.valid===false)throw new Error(online.message||"Token tidak valid.");

      const tok=tokenValid(t,s.name,s.className);
      if(!tok)throw new Error("Token tidak valid, tidak aktif, atau sudah digunakan.");

      startExam(s,tok);
    }catch(e){
      err.textContent=e.message||"Gagal terhubung ke Spreadsheet.";
      err.classList.remove("hidden");
    }finally{
      btn.disabled=false; btn.textContent="Mulai Ujian";
    }
  };
  document.getElementById("admin").onclick=()=>{state.screen="adminLogin";render()};
}

function renderExam(app){
  const q=state.examQuestions[state.current];
  app.innerHTML=`<div class="flex flex-col h-full bg-[${config.background_color}]">
    <div class="p-4 bg-white shadow flex justify-between items-center">
      <div><h2 class="font-bold">${esc(state.studentName)}</h2><p class="text-sm">Kelas ${esc(state.studentClass)} • Soal ${state.current+1}/${state.examQuestions.length}</p></div>
      <div class="text-right"><div id="timer" class="font-bold text-blue-600 text-xl">${formatTime(state.timeLeft)}</div><p class="text-sm text-slate-600">Waktu tersisa</p></div>
    </div>
    <div class="flex-1 overflow-y-auto p-4">${state.locked?`<div class="text-center mt-20 text-red-600 font-bold text-xl">Ujian dikunci karena keluar dari fullscreen.</div>`:
    `<div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow question-card">
      <div class="flex mb-4"><span class="bg-blue-500 text-white px-3 py-1 rounded-lg mr-3 font-bold">${state.current+1}</span><p class="font-semibold">${esc(q.question)}</p></div>
      <div class="space-y-3">${q.options.map((opt,i)=>{const sel=state.answers[state.current]===i;return `<button class="option-button w-full text-left p-3 border-2 rounded-lg ${sel?"bg-green-500 text-white border-green-600":"border-slate-300"}" data-i="${i}"><span class="font-bold">${String.fromCharCode(65+i)}.</span> ${esc(opt)}</button>`}).join("")}</div>
    </div>
    <div class="max-w-3xl mx-auto flex justify-between mt-6">${state.current?`<button id="prev" class="px-4 py-2 rounded-lg border border-blue-600 text-blue-700">← Sebelumnya</button>`:`<span></span>`}
      ${state.current===state.examQuestions.length-1?`<button id="submit" class="px-6 py-2 bg-green-600 text-white font-bold rounded-lg">Selesai & Kirim</button>`:`<button id="next" class="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg">Selanjutnya →</button>`}</div>`}</div></div>`;
  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>selectAnswer(+b.dataset.i));
  document.getElementById("prev")?.addEventListener("click",()=>navigate(-1));
  document.getElementById("next")?.addEventListener("click",()=>navigate(1));
  document.getElementById("submit")?.addEventListener("click",()=>{if(confirm("Yakin ingin mengakhiri ujian?"))submitExam()});
}

function renderResult(app){
  const r=state.final,g=r.score>=90?"A":r.score>=80?"B":r.score>=70?"C":"D";
  app.innerHTML=`<div class="min-h-full flex items-center justify-center bg-[${config.background_color}] p-4"><div class="bg-white p-8 rounded-2xl shadow-xl text-center max-w-lg w-full">
    <h1 class="text-2xl font-bold mb-2">Ujian Selesai!</h1><p class="mb-5">${r.passed?"Selamat, nilai mencapai KKM.":"Nilai belum mencapai KKM."}</p>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
      <div class="bg-blue-50 rounded-lg p-3"><b class="text-3xl text-blue-600">${r.score}</b><p class="text-sm">Nilai</p></div>
      <div class="bg-green-50 rounded-lg p-3"><b class="text-3xl text-green-600">${r.correct}</b><p class="text-sm">Benar</p></div>
      <div class="bg-red-50 rounded-lg p-3"><b class="text-3xl text-red-600">${r.wrong}</b><p class="text-sm">Salah</p></div>
      <div class="bg-amber-50 rounded-lg p-3"><b class="text-3xl text-amber-600">${r.blank}</b><p class="text-sm">Kosong</p></div>
    </div>
    <p class="mb-5">KKM: <b>${r.kkm}</b> • Status: <b class="${r.passed?"text-green-600":"text-red-600"}">${r.passed?"LULUS":"BELUM LULUS"}</b> • Predikat ${g}</p>
    <button id="finish" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Kembali</button>
  </div></div>`;
  document.getElementById("finish").onclick=()=>{try{document.exitFullscreen()}catch{};state.screen="start";render()};
}

function adminNav(){
  const tabs=[["dashboard","Dashboard"],["students","Data Siswa"],["questions","Bank Soal"],["tokens","Token"],["reports","Laporan"]];
  return tabs.map(([id,label])=>`<button data-tab="${id}" class="px-3 py-2 rounded-lg font-semibold ${state.adminTab===id?"tab-active":""}">${label}</button>`).join("");
}
function renderAdmin(app){
  app.innerHTML=`<div class="min-h-full bg-slate-100"><header class="bg-slate-900 text-white p-4"><div class="max-w-7xl mx-auto flex flex-wrap justify-between gap-3 items-center"><div><h1 class="text-xl font-bold">Panel Admin Ujian</h1><p class="text-slate-300 text-sm">${esc(config.school_name)}</p></div><div class="flex flex-wrap gap-2">${adminNav()}<button id="logout" class="px-3 py-2 rounded-lg bg-red-600">Keluar</button></div></div></header><main class="max-w-7xl mx-auto p-4" id="adminContent"></main></div>`;
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.adminTab=b.dataset.tab;renderAdmin(document.getElementById("app"))});
  document.getElementById("logout").onclick=()=>{state.screen="start";render()};
  const c=document.getElementById("adminContent");
  if(state.adminTab==="dashboard")renderDashboard(c);
  if(state.adminTab==="students")renderStudents(c);
  if(state.adminTab==="questions")renderQuestions(c);
  if(state.adminTab==="tokens")renderTokens(c);
  if(state.adminTab==="reports")renderReports(c);
}

function card(title,value,sub=""){return `<div class="bg-white rounded-xl shadow p-5"><p class="text-slate-500">${title}</p><b class="text-3xl">${value}</b><p class="text-xs text-slate-500">${sub}</p></div>`}

function renderDashboard(c){
  const s=getStudents(),q=getQuestions(),t=getTokens(),r=getResults(),passed=r.filter(x=>x.passed).length,avg=r.length?Math.round(r.reduce((a,x)=>a+x.score,0)/r.length):0;
  c.innerHTML=`<div class="mb-5"><h2 class="text-2xl font-bold">Dashboard</h2><p class="text-slate-600">Ringkasan data ujian.</p></div>
  <div class="grid md:grid-cols-5 gap-4">${card("Siswa",s.length)}${card("Soal",q.length)}${card("Token Aktif",t.filter(x=>x.active&&!x.used).length)}${card("Peserta Ujian",r.length)}${card("Rata-rata Nilai",avg,`KKM ${config.kkm}`)}</div>
  <div class="bg-white rounded-xl shadow p-5 mt-5"><h3 class="font-bold mb-3">Ringkasan Kelulusan</h3><div class="flex gap-6"><div><b class="text-green-600 text-2xl">${passed}</b><p>Lulus</p></div><div><b class="text-red-600 text-2xl">${r.length-passed}</b><p>Belum lulus</p></div></div></div>
  <div class="bg-white rounded-xl shadow p-5 mt-5"><h3 class="font-bold mb-3">Pengaturan</h3><div class="grid md:grid-cols-3 gap-3"><label>KKM<input id="kkm" type="number" min="0" max="100" value="${config.kkm}" class="w-full border rounded-lg p-2"></label><label>Durasi (menit)<input id="duration" type="number" min="1" value="${Math.round(config.duration/60)}" class="w-full border rounded-lg p-2"></label><button id="saveSettings" class="bg-blue-600 text-white rounded-lg p-2 mt-5">Simpan Pengaturan</button></div></div>`;
  document.getElementById("saveSettings").onclick=()=>{config.kkm=Math.max(0,Math.min(100,+document.getElementById("kkm").value||75));config.duration=Math.max(60,(+document.getElementById("duration").value||10)*60);alert("Pengaturan tersimpan untuk sesi ini.")};
}

      <div class="flex gap-2"><button id="exportStudents" class="border px-4 py-2 rounded-lg">Export CSV</button><label class="border px-4 py-2 rounded-lg cursor-pointer">Import CSV<input id="importStudents" type="file" accept=".csv,text/csv" class="hidden"></label></div>

  <p class="text-xs text-slate-500 mt-3">Format import: id,nama,kelas. Header opsional.</p>`;
  document.getElementById("studentFormInline").onsubmit=e=>{
    e.preventDefault();
    const id=document.getElementById("studentId").value.trim(),name=document.getElementById("studentName").value.trim(),cls=document.getElementById("studentClass").value.trim();
    const students=getStudents();
    if(students.some(x=>x.id.toLowerCase()===id.toLowerCase()))return alert("ID siswa sudah digunakan.");
    students.push({id,name,className:cls});save("studentsDB",students);
    apiWrite("student",{id,name,className:cls});
    renderAdmin(document.getElementById("app"));
  };
  document.getElementById("exportStudents").onclick=()=>downloadText("data-siswa.csv",["id,nama,kelas",...s.map(x=>[x.id,x.name,x.className].map(csvCell).join(","))].join("\n"));
  document.getElementById("importStudents").onchange=e=>importStudents(e.target.files[0]);
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("Hapus siswa ini?")){save("studentsDB",getStudents().filter(x=>x.id!==b.dataset.del));renderAdmin(document.getElementById("app"))}});

function studentForm(){
  const id=prompt("ID siswa (kosong = otomatis):",""); if(id===null)return;
  const name=prompt("Nama siswa:",""); if(!name)return;
  const cls=prompt("Kelas:","7.1");if(!cls)return;
  const s=getStudents();s.push({id:id.trim()||uid("S"),name:name.trim(),className:cls.trim()});save("studentsDB",s);renderAdmin(document.getElementById("app"));
}
function importStudents(file){
  if(!file)return;const rd=new FileReader();rd.onload=()=>{const rows=parseCSV(rd.result);let s=getStudents(),added=0;rows.forEach((r,i)=>{if(i===0&&/nama|name/i.test(r[1]||""))return;if((r[1]||"").trim()){s.push({id:(r[0]||"").trim()||uid("S"),name:r[1].trim(),className:(r[2]||"").trim()||"7.1"});added++}});save("studentsDB",s);alert(`${added} siswa diimpor.`);renderAdmin(document.getElementById("app"))};rd.readAsText(file);
}

function showBulkQuestionForm(){
  const area=document.getElementById("bulkQuestionArea");
  const single=document.getElementById("singleQuestionArea");
  if(!area)return;
  if(single)single.classList.add("hidden");
  area.classList.remove("hidden");

  let forms=[];
  function blankForm(){
    return {question:"",a:"",b:"",c:"",d:"",weight:1,correct:0,chapter:""};
  }
  function addForm(){
    readForms();
    forms.push(blankForm());
    renderForms();
  }
  function removeForm(i){
    readForms();
    if(forms.length===1)return alert("Minimal harus ada 1 soal.");
    forms.splice(i,1);
    renderForms();
  }
  function readForms(){
    document.querySelectorAll(".bulk-question-item").forEach((item,i)=>{
      if(!forms[i])return;
      forms[i].question=item.querySelector('[data-field="question"]').value;
      forms[i].a=item.querySelector('[data-field="a"]').value;
      forms[i].b=item.querySelector('[data-field="b"]').value;
      forms[i].c=item.querySelector('[data-field="c"]').value;
      forms[i].d=item.querySelector('[data-field="d"]').value;
      forms[i].weight=Math.max(1,+item.querySelector('[data-field="weight"]').value||1);
      forms[i].correct=+item.querySelector('[data-field="correct"]').value||0;
      forms[i].chapter=item.querySelector('[data-field="chapter"]').value;
    });
  }

  function renderForms(){
    area.innerHTML=`
      <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
        <div>
          <h3 class="text-xl font-bold text-slate-800">Tambah Soal Banyak</h3>
          <p class="text-sm text-slate-500">Tampil seperti halaman kosong MS Word. Isi soal dari atas ke bawah, lalu tambahkan soal berikutnya.</p>
        </div>
        <button id="closeBulkQuestions" type="button" class="border border-slate-300 bg-white px-4 py-2 rounded-lg">Tutup</button>
      </div>

      <div class="bg-white border border-slate-300 rounded-lg shadow-sm max-w-4xl mx-auto">
        <div class="px-8 py-7 md:px-12 md:py-10" id="bulkForms"></div>
      </div>

      <div class="max-w-4xl mx-auto mt-4 flex flex-wrap items-center gap-3">
        <button id="addBulkOne" type="button" class="border-2 border-dashed border-blue-400 text-blue-700 bg-white px-5 py-3 rounded-lg font-bold">＋ Tambah 1 Soal</button>
        <button id="addBulkFive" type="button" class="border border-blue-300 text-blue-700 bg-white px-5 py-3 rounded-lg font-bold">＋ Tambah 5 Soal</button>
        <button id="saveBulkAll" type="button" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold">💾 Simpan Semua Soal</button>
        <button id="clearBulkAll" type="button" class="border border-red-300 text-red-600 px-5 py-3 rounded-lg">Kosongkan Semua</button>
        <span class="text-sm text-slate-500 ml-auto">Jumlah soal: <b id="bulkQuestionCount">${forms.length}</b></span>
      </div>
    `;

    const countEl=document.getElementById("bulkQuestionCount");
    if(countEl)countEl.textContent=forms.length;

    const box=document.getElementById("bulkForms");
    box.innerHTML=forms.map((f,i)=>`
      <div class="bulk-question-item" data-index="${i}" style="font-family:Calibri,Arial,sans-serif;">
        <div class="flex items-center justify-between mb-3">
          <div class="text-base font-semibold text-slate-700">${i+1}.</div>
          <button type="button" data-remove-bulk="${i}" class="text-xs text-red-500 hover:text-red-700">Hapus soal</button>
        </div>

        <textarea data-field="question" rows="2"
          class="w-full border-0 border-b border-slate-300 focus:border-blue-500 focus:ring-0 outline-none px-0 py-2 text-base leading-7 resize-y"
          placeholder="Ketik pertanyaan di sini...">${esc(f.question)}</textarea>

        <div class="mt-4 space-y-2 text-base">
          <div class="flex items-start gap-2">
            <span class="pt-1 w-6">A.</span>
            <input data-field="a" value="${esc(f.a)}" class="flex-1 border-0 border-b border-slate-200 focus:border-blue-500 focus:ring-0 outline-none px-0 py-1.5" placeholder="Pilihan jawaban A">
          </div>
          <div class="flex items-start gap-2">
            <span class="pt-1 w-6">B.</span>
            <input data-field="b" value="${esc(f.b)}" class="flex-1 border-0 border-b border-slate-200 focus:border-blue-500 focus:ring-0 outline-none px-0 py-1.5" placeholder="Pilihan jawaban B">
          </div>
          <div class="flex items-start gap-2">
            <span class="pt-1 w-6">C.</span>
            <input data-field="c" value="${esc(f.c)}" class="flex-1 border-0 border-b border-slate-200 focus:border-blue-500 focus:ring-0 outline-none px-0 py-1.5" placeholder="Pilihan jawaban C">
          </div>
          <div class="flex items-start gap-2">
            <span class="pt-1 w-6">D.</span>
            <input data-field="d" value="${esc(f.d)}" class="flex-1 border-0 border-b border-slate-200 focus:border-blue-500 focus:ring-0 outline-none px-0 py-1.5" placeholder="Pilihan jawaban D">
          </div>
        </div>

        <div class="mt-5 text-sm text-slate-500 flex flex-wrap gap-x-6 gap-y-2">
          <label>Bobot:
            <input data-field="weight" type="number" min="1" value="${f.weight}"
              class="w-16 ml-1 border-0 border-b border-slate-300 focus:border-blue-500 focus:ring-0 outline-none text-center">
          </label>
          <label>Jawaban:
            <select data-field="correct"

              <option value="2" ${f.correct===2?"selected":""}>C</option>
              <option value="3" ${f.correct===3?"selected":""}>D</option>

          <label>Bab/Materi:
            <input data-field="chapter" value="${esc(f.chapter)}"

          </label>
        </div>

    `).join("");

    document.querySelectorAll("[data-remove-bulk]").forEach(btn=>{

    });

    document.getElementById("addBulkOne").onclick=()=>{
      addForm();
      const items=document.querySelectorAll(".bulk-question-item");
      items[items.length-1]?.scrollIntoView({behavior:"smooth",block:"center"});
      items[items.length-1]?.querySelector('[data-field="question"]')?.focus();
    };

    document.getElementById("addBulkFive").onclick=()=>{
      readForms();
      for(let n=0;n<5;n++)forms.push(blankForm());
      renderForms();
      const items=document.querySelectorAll(".bulk-question-item");
      items[items.length-5]?.scrollIntoView({behavior:"smooth",block:"center"});
      items[items.length-5]?.querySelector('[data-field="question"]')?.focus();
    };

    document.getElementById("clearBulkAll").onclick=()=>{
      if(confirm("Kosongkan semua form soal?")){
        forms=[blankForm()];
        renderForms();
        document.querySelector('[data-field="question"]')?.focus();
      }
    };

    document.getElementById("closeBulkQuestions").onclick=()=>{
      area.classList.add("hidden");
      if(single)single.classList.remove("hidden");
    };

    document.getElementById("saveBulkAll").onclick=()=>{
      readForms();
      const valid=forms.filter(f=>f.question.trim()||f.a.trim()||f.b.trim()||f.c.trim()||f.d.trim());
      if(!valid.length)return alert("Belum ada soal yang diisi.");

      for(let i=0;i<valid.length;i++){
        const f=valid[i];
        if(!f.question.trim()||!f.a.trim()||!f.b.trim()||!f.c.trim()||!f.d.trim()){
          return alert(`Soal ${i+1} belum lengkap. Isi pertanyaan dan pilihan A-D.`);
        }
      }

      const db=getQuestions();
      const startNo=db.reduce((m,x)=>Math.max(m,Number(x.no)||0),0)+1;
      const added=valid.map((f,i)=>({
        id:uid("Q"),
        no:startNo+i,
        question:f.question.trim(),
        options:[f.a.trim(),f.b.trim(),f.c.trim(),f.d.trim()],
        correct:Math.max(0,Math.min(3,Number(f.correct)||0)),
        weight:Math.max(1,Number(f.weight)||1),
        chapter:f.chapter.trim()
      }));

      save("questionsDB",[...db,...added]);

      Promise.all(added.map(x=>apiWrite("question",x))).finally(()=>{
        alert(`${added.length} soal berhasil disimpan.`);
        renderAdmin(document.getElementById("app"));
      });
    };
  }

  // Saat tombol "Tambah Soal Banyak" ditekan, langsung tampil 1 halaman/form kosong.
  forms=[blankForm()];
  renderForms();
  setTimeout(()=>document.querySelector('[data-field="question"]')?.focus(),50);
}

function parseDocxParagraphs(xmlText){
  const xml=new DOMParser().parseFromString(xmlText,"application/xml");
  if(xml.querySelector("parsererror")) throw new Error("Dokumen Word tidak dapat dibaca.");
  const paras=[...xml.getElementsByTagNameNS("http://schemas.openxmlformats.org/wordprocessingml/2006/main","p")];
  return paras.map(p=>{
    let s="";
    [...p.getElementsByTagNameNS("http://schemas.openxmlformats.org/wordprocessingml/2006/main","t")].forEach(t=>s+=t.textContent||"");
    [...p.getElementsByTagNameNS("http://schemas.openxmlformats.org/wordprocessingml/2006/main","tab")].forEach(()=>s+="\t");
    [...p.getElementsByTagNameNS("http://schemas.openxmlformats.org/wordprocessingml/2006/main","br")].forEach(()=>s+="\n");
    return s.replace(/\u00a0/g," ").trim();
  }).filter(Boolean);
}

function parseWordQuestions(lines){
  const result=[];
  let current=null;
  let optionIndex=-1;

  const flush=()=>{
    if(!current)return;
    current.question=current.question.trim();
    current.options=current.options.map(x=>x.trim());
    if(current.question && current.options.every(x=>x)){
      result.push(current);
    }
    current=null;
    optionIndex=-1;
  };

  for(let raw of lines){
    let line=String(raw||"").trim();
    if(!line)continue;

    // Normalisasi bullet/nomor yang kadang muncul dari Word.
    line=line.replace(/^[•·▪◦]\s*/,"").trim();

    // Nomor soal: "1. ..." / "1) ..." / "1 - ..."
    const qMatch=line.match(/^(\d+)\s*[\.\)\-:]\s*(.*)$/);
    if(qMatch){
      flush();
      current={
        id:uid("Q"),
        no:Number(qMatch[1]),
        question:qMatch[2].trim(),
        options:["","","",""],
        correct:0,
        weight:1,
        chapter:""
      };
      continue;
    }

    // Jika belum ada nomor, abaikan bagian pembuka dokumen.
    if(!current)continue;

    const optMatch=line.match(/^([A-Da-d])\s*[\.\)\:\-]\s*(.*)$/);
    if(optMatch){
      const idx=optMatch[1].toUpperCase().charCodeAt(0)-65;
      current.options[idx]=optMatch[2].trim();
      optionIndex=idx;
      continue;
    }

    const answerMatch=line.match(/^(?:jawaban|kunci(?:\s+jawaban)?)\s*[:\-]\s*([A-Da-d])\b/i);
    if(answerMatch){
      current.correct=answerMatch[1].toUpperCase().charCodeAt(0)-65;
      continue;
    }

    const weightMatch=line.match(/^bobot\s*[:\-]\s*(\d+(?:[.,]\d+)?)\b/i);
    if(weightMatch){
      current.weight=Math.max(1,Number(weightMatch[1].replace(",","."))||1);
      continue;
    }

    const chapterMatch=line.match(/^(?:bab|materi)\s*[:\-]\s*(.*)$/i);
    if(chapterMatch){
      current.chapter=chapterMatch[1].trim();
      continue;
    }

    // Baris lanjutan pertanyaan atau pilihan.
    if(optionIndex>=0 && optionIndex<4){
      current.options[optionIndex]+=(current.options[optionIndex]?" ":"")+line;
    }else{
      current.question+=(current.question?" ":"")+line;
    }
  }
  flush();
  return result;
}

async function importWordQuestions(file){
  if(!file)return;
  if(!window.JSZip){
    return alert("Modul pembaca Word belum termuat. Pastikan internet aktif lalu buka ulang aplikasi.");
  }

  try{
    const zip=await JSZip.loadAsync(file);
    const docFile=zip.file("word/document.xml");
    if(!docFile)throw new Error("File bukan dokumen Word .docx yang valid.");

    const xml=await docFile.async("string");
    const lines=parseDocxParagraphs(xml);
    const imported=parseWordQuestions(lines);

    if(!imported.length){
      return alert(
        "Tidak ada soal yang berhasil dibaca.\n\n"+
        "Gunakan format:\n"+
        "1. Pertanyaan...\n"+
        "A. Pilihan A\nB. Pilihan B\nC. Pilihan C\nD. Pilihan D\n"+
        "Bobot: 1\nJawaban: B"
      );
    }

    const db=getQuestions();
    const startNo=db.reduce((m,x)=>Math.max(m,Number(x.no)||0),0)+1;

    const added=imported.map((x,i)=>({
      ...x,
      id:uid("Q"),
      no:startNo+i
    }));

    // Tampilkan konfirmasi jumlah soal sebelum menyimpan.
    const ok=confirm(
      `Ditemukan ${added.length} soal dari Word.\n\n`+
      `Soal akan ditambahkan mulai nomor ${startNo}.\n\n`+
      `Klik OK untuk Simpan Semua ke Bank Soal.`
    );
    if(!ok)return;

    save("questionsDB",[...db,...added]);
    await Promise.all(added.map(x=>apiWrite("question",x)));

    alert(`${added.length} soal dari Word berhasil diimpor dan disimpan.`);
    renderAdmin(document.getElementById("app"));
  }catch(err){
    console.error(err);
    alert("Gagal membaca file Word: "+(err.message||err));
  }
}

function importQuestions(file){
  if(!file)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    const rows=parseCSV(rd.result);
    let q=getQuestions(),addedRows=[];
    rows.forEach((r,i)=>{
      if(i===0&&/soal|question/i.test(r[2]||r[1]||""))return;
      const question=(r[2]||r[1]||"").trim();
      if(question&&r.length>=7){
        const item={
          id:(r[0]||"").trim()||uid("Q"),
          no:q.length+addedRows.length+1,
          question,
          options:[r[3]||r[2]||"",r[4]||r[3]||"",r[5]||r[4]||"",r[6]||r[5]||""],
          correct:Math.max(0,Math.min(3,+r[7]||+r[6]||0)),
          weight:Math.max(1,+r[8]||+r[7]||1),
          chapter:(r[9]||r[8]||"").trim()
        };
        if(item.options.every(x=>String(x).trim()!==""))addedRows.push(item);
      }
    });
    if(!addedRows.length)return alert("Tidak ada soal valid yang ditemukan dalam file CSV.");
    q=q.concat(addedRows);
    save("questionsDB",q);
    await Promise.all(addedRows.map(x=>apiWrite("question",x)));
    alert(`${addedRows.length} soal berhasil diimpor dan disimpan.`);
    renderAdmin(document.getElementById("app"));
  };
  rd.readAsText(file);
}

function createToken(){
  const codeInput=prompt(
    "MASUKKAN TOKEN UJIAN UMUM\n\nToken ini berlaku untuk semua siswa.\nContoh: UJIAN7A-001",
    ""
  );
  if(codeInput===null)return;

  const code=normalizeToken(codeInput);
  if(!code)return alert("Token tidak boleh kosong.");

  const tokens=getTokens();
  if(tokens.some(t=>normalizeToken(t.code)===code)){
    return alert("Token tersebut sudah ada. Gunakan token lain.");
  }

  const token={
    code,
    active:true,
    used:false,
    studentId:null,
    createdAt:now()
  };

  tokens.push(token);
  save("tokensDB",tokens);
  apiWrite("token",token);

  alert("Token umum berhasil dibuat: "+code);
  renderAdmin(document.getElementById("app"));
}

function exportReports(r){
  const head="id,tanggal,nama,kelas,token,nilai,benar,salah,kosong,total,kkm,status";
  const lines=r.map(x=>[x.id,x.date,x.name,x.className,x.token,x.score,x.correct,x.wrong,x.blank,x.total,x.kkm,x.passed?"LULUS":"BELUM LULUS"].map(csvCell).join(","));
  downloadText("laporan-ujian.csv",[head,...lines].join("\n"));
}
function showResultDetail(r){
  if(!r)return;
  const wrong=r.details.filter(x=>x.answer!==x.correct);
  const text=wrong.map((x,i)=>`${i+1}. ${x.question}\nJawaban siswa: ${x.answer===null?"Kosong":x.options[x.answer]}\nKunci: ${x.options[x.correct]}`).join("\n\n");
  alert(`Nama: ${r.name}\nKelas: ${r.className}\nNilai: ${r.score}\nBenar: ${r.correct}\nSalah: ${r.wrong}\nKosong: ${r.blank}\nKKM: ${r.kkm}\nStatus: ${r.passed?"LULUS":"BELUM LULUS"}\n\nDETAIL SOAL SALAH/KOSONG:\n${text||"Tidak ada."}`);
}

<div id="examLockOverlay">
  <div class="exam-lock-card">
    <div style="font-size:42px;margin-bottom:10px">🔒</div>
    <h2 style="font-size:24px;font-weight:800;margin:0 0 8px">Ujian Dikunci</h2>
    <p style="color:#cbd5e1;margin:0 0 20px">
      Tampilan ujian harus dalam mode layar penuh.<br>
      Silakan kembali ke layar penuh untuk melanjutkan ujian.
    </p>
    <button id="resumeFullscreenBtn"
      style="width:100%;padding:12px 16px;border:0;border-radius:10px;
             background:#2563eb;color:white;font-weight:700;cursor:pointer">
      Kembali ke Layar Penuh
    </button>
  </div>
</div>

<script>
(function(){
  let examActive=false;
  let examLocked=false;

  function isExamScreen(){
    return !!document.querySelector('[data-exam-screen], .exam-screen, #examScreen');
  }

  async function enterExamFullscreen(){
    try{
      if(document.fullscreenElement) return true;
      const el=document.documentElement;
      if(el.requestFullscreen){
        await el.requestFullscreen({navigationUI:"hide"});
        return true;
      }
    }catch(e){
      console.warn("Fullscreen gagal:",e);
    }
    return false;
  }

  function lockExam(){
    if(!examActive) return;
    examLocked=true;
    document.body.classList.add("exam-mode");
    const overlay=document.getElementById("examLockOverlay");
    if(overlay) overlay.classList.add("show");
  }

  function unlockExam(){
    examLocked=false;
    const overlay=document.getElementById("examLockOverlay");
    if(overlay) overlay.classList.remove("show");
  }

  async function startExamProtection(){
    examActive=true;
    document.body.classList.add("exam-mode");
    await enterExamFullscreen();
  }

  function stopExamProtection(){
    examActive=false;
    examLocked=false;
    document.body.classList.remove("exam-mode");
    const overlay=document.getElementById("examLockOverlay");
    if(overlay) overlay.classList.remove("show");
  }

  document.addEventListener("fullscreenchange",function(){
    if(!examActive) return;

    if(!document.fullscreenElement){
      lockExam();
    }else{
      unlockExam();
    }
  });

  document.addEventListener("visibilitychange",function(){
    if(examActive && document.visibilityState !== "visible"){
      // Jangan menyelesaikan ujian otomatis; kunci tampilan saat kembali.
      examLocked=true;
    }
  });

  window.addEventListener("blur",function(){
    if(examActive) examLocked=true;
  });

  window.startExamProtection=startExamProtection;
  window.stopExamProtection=stopExamProtection;
  window.enterExamFullscreen=enterExamFullscreen;

  document.addEventListener("click",async function(e){
    if(e.target && e.target.id==="resumeFullscreenBtn"){
      const ok=await enterExamFullscreen();
      if(ok){
        unlockExam();
      }else{
        alert("Browser tidak mengizinkan layar penuh. Klik tombol ini lagi atau gunakan Chrome/Edge.");
      }
    }
  });

  // Setelah DOM siap, pantau perpindahan ke halaman ujian.
  const observer=new MutationObserver(function(){
    const exam= isExamScreen();
    if(exam && !examActive){
      startExamProtection();
    }else if(!exam && examActive){
      stopExamProtection();
    }
  });

  observer.observe(document.body,{childList:true,subtree:true});

  // API global untuk dipanggil langsung setelah login.
  window.__examProtection={
    start:startExamProtection,
    stop:stopExamProtection,
    lock:lockExam,
    unlock:unlockExam
  };
})();
</script>


<script>
window.addEventListener("beforeunload",function(e){
  if(window.__examProtection && document.body.classList.contains("exam-mode")){
    e.preventDefault();
    e.returnValue="";
  }
});
history.pushState({examGuard:true},"",location.href);
window.addEventListener("popstate",function(){
  if(document.body.classList.contains("exam-mode")){
    history.pushState({examGuard:true},"",location.href);
    if(window.__examProtection) window.__examProtection.lock();
  }
});
</script>
